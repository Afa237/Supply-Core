{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Supply Core</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/auth.css' %}"
    >

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-brand">

            <div class="brand-logo">
                SC
            </div>

            <div>

                <h2>Supply Core</h2>

                <p>
                    Supply Chain Management
                </p>

            </div>

        </div>


        <h3>Welcome Back</h3>

        <p class="text-muted">
            Login to access your workspace.
        </p>


        {% if messages %}

            {% for message in messages %}

                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="post">

            {% csrf_token %}


            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="mb-2">

                <div class="d-flex justify-content-between">

                    <label class="form-label">
                        Password
                    </label>

                    <a
                        href="{% url 'password_reset' %}"
                        class="small"
                    >
                        Forgot password?
                    </a>

                </div>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary w-100 mt-3"
            >
                Login
            </button>

        </form>


        <div class="auth-divider">
            <span>New to Supply Core?</span>
        </div>


        <a
            href="{% url 'register' %}"
            class="btn btn-outline-primary w-100"
        >
            Create New Account
        </a>

    </div>

</div>

</body>

</html>
