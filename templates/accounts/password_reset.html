{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | Supply Core</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/auth.css' %}"
    >

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <h2>Forgot Password?</h2>

        <p class="text-muted">

            Enter the email connected to your Supply Core account.

        </p>


        <form method="post">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                {{ form.email }}

            </div>


            <button
                class="btn btn-primary w-100"
                type="submit"
            >
                Send Reset Link
            </button>

        </form>


        <a
            href="{% url 'login' %}"
            class="d-block text-center mt-4"
        >
            Back to Login
        </a>

    </div>

</div>

</body>

</html>
