{% extends "layout/dashboard_base.html" %}

{% block content %}

<div class="mb-4">

    <h2>
        Manage User
    </h2>

    <p class="text-muted">
        {{ managed_user.username }}
    </p>

</div>


<div class="card border-0 shadow-sm">

    <div class="card-body">

        <form method="post">

            {% csrf_token %}


            <div class="row">


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        First Name
                    </label>

                    <input
                        type="text"
                        name="first_name"
                        class="form-control"
                        value="{{ managed_user.first_name }}"
                    >

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Last Name
                    </label>

                    <input
                        type="text"
                        name="last_name"
                        class="form-control"
                        value="{{ managed_user.last_name }}"
                    >

                </div>


                <div class="col-md-12 mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ managed_user.email }}"
                    >

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Department
                    </label>

                    <select
                        name="department"
                        class="form-select"
                    >

                        <option value="">
                            Not Assigned
                        </option>

                        {% for value, label in department_choices %}

                            <option
                                value="{{ value }}"
                                {% if profile.department == value %}
                                    selected
                                {% endif %}
                            >
                                {{ label }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Role
                    </label>

                    <select
                        name="role"
                        class="form-select"
                    >

                        {% for value, label in role_choices %}

                            <option
                                value="{{ value }}"
                                {% if profile.role == value %}
                                    selected
                                {% endif %}
                            >
                                {{ label }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="col-md-12 mb-4">

                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            name="is_active"
                            id="is_active"

                            {% if managed_user.is_active %}
                                checked
                            {% endif %}
                        >

                        <label
                            class="form-check-label"
                            for="is_active"
                        >
                            User account is active
                        </label>

                    </div></div>


            </div>


            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Changes
            </button>


            <a
                href="{% url 'user_list' %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>


        </form>

    </div>

</div>

{% endblock %}
