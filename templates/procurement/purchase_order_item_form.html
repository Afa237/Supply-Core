{% extends "layout/dashboard_base.html" %}

{% block content %}

<h2 class="mb-2">{{ page_title }}</h2>

<p class="text-muted">
    {{ purchase_order.po_number }} —
    {{ purchase_order.supplier.name }}
</p>

<div class="card border-0 shadow-sm">
    <div class="card-body">

        <form method="post">
            {% csrf_token %}

            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% for error in field.errors %}
                        <div class="text-danger small mt-1">
                            {{ error }}
                        </div>
                    {% endfor %}
                </div>
            {% endfor %}

            <button class="btn btn-primary">
                Save Item
            </button>

            <a
                href="{% url 'purchase_order_detail' purchase_order.id %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>
        </form>

    </div>
</div>

{% endblock %}
