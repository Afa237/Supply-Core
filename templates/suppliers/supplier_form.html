{% extends "layout/dashboard_base.html" %}

{% block content %}

<div class="mb-4">
    <h2>{{ page_title }}</h2>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}

            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% for error in field.errors %}
                        <div class="text-danger small mt-1">
                            {{ error }}
                        </div>
                    {% endfor %}
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-primary">
                Save Supplier
            </button>

            <a href="{% url 'supplier_list' %}" class="btn btn-secondary">
                Cancel
            </a>
        </form>
    </div>
</div>

{% endblock %}
